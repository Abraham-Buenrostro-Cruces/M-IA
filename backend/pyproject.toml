[project]
name = "rutaaccesible-backend"
version = "0.1.0"
description = "api-core de RutaAccesible: planificación de rutas accesibles en el transporte público de la CDMX"
requires-python = ">=3.12,<3.13"
# Sólo lo que ya se usa; NetworkX (F2), RapidFuzz, Pillow, etc. se agregan en su fase.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # F1 — datos
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.2", # cliente HTTP que pide starlette.testclient (antes httpx)
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "bd: prueba de integración que requiere PostGIS (docker compose up -d); se omite si no está disponible",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migraciones generadas por Alembic: se revisan a mano, no se reformatean.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F/W: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna
# SIM: simplificaciones · N: convenciones de nombres.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
# backend/alembic/ es la carpeta de migraciones, no el paquete; sin esto ruff trata
# "alembic" como código propio y separa sus imports.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Las fórmulas del documento usan letras griegas y mayúsculas (alpha, beta, IAR);
# permitimos esos nombres en el dominio para que el código se lea igual que la matemática.
"app/dominio/**" = ["N802", "N803", "N806"]
